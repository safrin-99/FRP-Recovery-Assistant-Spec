[package]
name = "frp-recovery-assistant"
version = "0.1.0"
description = "FRP Recovery Assistant — Android Recovery & Diagnostics Suite"
edition = "2021"
rust-version = "1.99"
publish = false

[lib]
# Nama berbeda dari bin untuk menghindari bentrok nama artefak di Windows (konvensi template Tauri 2).
name = "frp_recovery_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# Tidak ada plugin shell/fs/http. Proses eksternal hanya adb/fastboot lewat fungsi allowlist.
tauri = { version = "2.12.5", features = [] }
# Hanya dipakai dari Rust (open_official_link); frontend tidak diberi izin opener.
tauri-plugin-opener = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = "0.7.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
